# micli + 9route/ezr preset (capability Auto pools)
# Copy/merge into ~/.grok/config.toml.
#
# Required:
#   export EZR_CLIENT_KEY="…"
# Optional alias:
#   export XAI_API_KEY="$EZR_CLIENT_KEY"
#
# Catalog note: relay GET /v1/models only lists ~4 models — declare [model.*]
# explicitly. Wire IDs must be ezr/<name>. GPT / e-g-* need max_completion_tokens.
#
# Auto capabilities (see MICLI.md):
#   coding_agent, coding_fast, reasoning_heavy, chat_default, cheap_bulk,
#   vision, long_context, chinese_biz, creative_write
# Force: MICLI_AUTO_CAPABILITY=coding_agent grok -m auto -p "…"

[endpoints]
models_base_url = "https://router.yundongyl.cn/v1"

[models]
default = "auto"

[model.auto]
model = "auto"
name = "Auto"
description = "micli Auto: capability router over ezr/* pools"
api_backend = "chat_completions"
env_key = ["EZR_CLIENT_KEY", "XAI_API_KEY"]
context_window = 200000

[model.micli-auto]
model = "micli-auto"
name = "micli Auto"
description = "Alias for Auto"
api_backend = "chat_completions"
env_key = ["EZR_CLIENT_KEY", "XAI_API_KEY"]
context_window = 200000

